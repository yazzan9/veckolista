<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckolista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Mono:wght@400;500&family=Doto:wght@800&display=swap">
<style>
/* Layout: one phone-width column per screen (welcome, login, signup, home). Home has a dot-matrix week overview, stacked weekday rows where the open day expands into a card, and a floating add button. Sheets and the calendar slide over it. */
:root {
  --bg: #d9d7d2;
  --surface: #e6e4df;
  --fg: #1b1b1a;
  --mute: #84827d;
  --line: #bcbab4;
  --dot-off: #bfbdb7;
  --accent: #ff4a1c;
  --on-accent: #ffffff;
  --f-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-dot: "Doto", "DM Mono", monospace;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #2a2a29; --surface: #363635; --fg: #eeede9; --mute: #8f8d88;
    --line: #4a4a48; --dot-off: #4b4b49; --accent: #ff5a2c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #2a2a29; --surface: #363635; --fg: #eeede9; --mute: #8f8d88;
  --line: #4a4a48; --dot-off: #4b4b49; --accent: #ff5a2c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-mono);
  font-size: 14px; line-height: 1.4;
  padding-block: 16px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.app { max-width: 460px; margin: 0 auto; }

.bar { display: flex; align-items: center; gap: 8px; }
.bar .sp { flex: 1; }
.pill {
  height: 34px; min-width: 34px; padding: 0 12px; border-radius: 17px;
  border: 1px solid var(--line); font-size: 11px; letter-spacing: .08em;
  display: inline-flex; align-items: center; justify-content: center;
}
.pill:hover { border-color: var(--fg); }
.pill.static { pointer-events: none; }

/* buttons, forms and the three start screens */
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border-radius: 28px; font-size: 13px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.btn.pri { background: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.out { border: 1px solid var(--line); font-size: 12px; letter-spacing: .12em; }
.btn.out:hover { border-color: var(--fg); }
.col { display: flex; flex-direction: column; min-height: calc(100vh - 96px); min-height: calc(100svh - 96px); }
.wel .big { font-family: var(--f-dot); font-weight: 800; font-size: 220px; line-height: .86; letter-spacing: .02em; margin-top: 52px; }
.wel .lblv { font-size: 11px; letter-spacing: .18em; color: var(--mute); margin-top: 52px; }
.wel .dots { display: flex; gap: 10px; margin-top: 26px; }
.wel .dots i { width: 18px; height: 18px; border-radius: 50%; background: var(--dot-off); }
.wel .dots i.on { background: var(--fg); }
.wel .dots i.now { background: var(--accent); }
.wel h1 { font-family: var(--f-display); font-weight: 800; font-size: 64px; line-height: 1; margin: 30px 0 10px; text-transform: uppercase; letter-spacing: .005em; }
.wel p { margin: 0; color: var(--mute); font-size: 13px; }
.acts { margin-top: auto; padding-top: 32px; display: flex; flex-direction: column; gap: 12px; }
.ttl { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: 1; text-transform: uppercase; margin: 28px 0 6px; letter-spacing: .005em; }
.sub { font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.form { background: var(--surface); border-radius: 28px; padding: 22px 20px 24px; margin-top: 22px; display: flex; flex-direction: column; gap: 22px; }
.fld { display: block; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
.fld.bad { border-bottom-color: var(--accent); }
.fl { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); margin-bottom: 8px; }
.fld input { width: 100%; min-width: 0; background: transparent; border: 0; color: var(--fg); font: inherit; font-size: 18px; padding: 2px 0; caret-color: var(--accent); }
.fld input::placeholder { color: var(--mute); opacity: .7; }
.fld input:focus-visible { outline: none; }
.fld:focus-within { border-bottom-color: var(--accent); }
.row { display: flex; align-items: center; gap: 10px; }
.show { font-size: 11px; letter-spacing: .1em; color: var(--mute); padding: 6px; flex: none; }
.show:hover { color: var(--fg); }
.err { min-height: 18px; font-size: 11px; letter-spacing: .08em; color: var(--accent); margin: 14px 2px 0; }
.link { font-size: 11px; letter-spacing: .1em; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--fg); }
.rowend { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
.or { display: flex; align-items: center; gap: 12px; margin: 20px 0; font-size: 10px; letter-spacing: .14em; color: var(--mute); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.soc { display: flex; gap: 12px; }
.soc .btn { min-height: 52px; }
.foot { display: flex; justify-content: center; gap: 8px; margin-top: auto; padding-top: 28px; font-size: 11px; letter-spacing: .08em; color: var(--mute); flex-wrap: wrap; }
.foot button { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; letter-spacing: .08em; }
.strength { display: flex; align-items: center; gap: 8px; margin-top: -8px; }
.strength i { width: 12px; height: 12px; border-radius: 50%; background: var(--dot-off); transition: background .2s; }
.strength i.on { background: var(--fg); }
.strength span { margin-left: auto; font-size: 10px; letter-spacing: .08em; color: var(--mute); }

/* home */
.hello { margin-top: 22px; }
.hello b { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .005em; }
.hello b em { font-style: normal; color: var(--accent); }
.hello div { margin-top: 4px; font-size: 10px; letter-spacing: .14em; color: var(--mute); }
.wk { display: flex; align-items: flex-end; gap: 14px; margin-top: 26px; width: 100%; text-align: left; }
.grid3 { display: grid; grid-template-columns: repeat(3, 6px); gap: 4px; margin-left: auto; align-self: flex-end; padding-bottom: 12px; }
.grid3 i { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
.grid3 i:nth-child(5) { background: var(--accent); }
.wk:hover .grid3 i:not(:nth-child(5)) { background: var(--mute); }
.wk .lbl { font-size: 11px; letter-spacing: .18em; color: var(--mute); padding-bottom: 14px; writing-mode: vertical-rl; transform: rotate(180deg); }
.wk .num { font-family: var(--f-dot); font-weight: 800; font-size: 104px; line-height: .86; letter-spacing: .02em; }
.range { margin-top: 12px; font-size: 12px; letter-spacing: .06em; color: var(--mute); }

.matrix { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 22px; }
.mcol { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 8px; border-radius: 12px; }
.mcol:hover { background: var(--surface); }
.mcol .l { font-size: 10px; letter-spacing: .1em; color: var(--mute); margin-bottom: 3px; }
.mcol.today .l { color: var(--accent); }
.mcol.sel { background: var(--surface); }
.dot { width: 15px; height: 15px; border-radius: 50%; background: var(--dot-off); transition: background .2s; }
.dot.done { background: var(--fg); }
.mcol.today .dot:not(.done):not(.ring) { background: var(--accent); }
.dot.ring { background: transparent; border: 1.5px solid var(--dot-off); }
.mcol.today .dot.ring { border-color: var(--accent); border-width: 2px; }
.more { font-size: 10px; color: var(--mute); line-height: 1; }
.sum { margin-top: 10px; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.sum b { color: var(--fg); font-weight: 500; }

#days { margin-top: 22px; }
.day { border-top: 1px solid var(--line); }
.day:last-child { border-bottom: 1px solid var(--line); }
.day.open { background: var(--surface); border-radius: 22px; border-color: transparent; padding: 0 18px 10px; margin-block: 6px; }
.day.open + .day { border-top-color: transparent; }
.dayhead { width: 100%; display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 10px; text-align: left; }
.day:not(.open) .dayhead { padding-inline: 2px; }
.name { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
.meta { font-size: 11px; letter-spacing: .1em; color: var(--mute); white-space: nowrap; }
.meta .now { color: var(--accent); }

ul.tasks { list-style: none; margin: 0; padding: 0; }
.task { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); }
.chk { width: 20px; height: 20px; border: 1.5px solid var(--fg); border-radius: 4px; position: relative; transition: background .15s, border-color .15s; }
.task.done .chk { background: var(--accent); border-color: var(--accent); }
.task.done .chk::after { content: ""; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(40deg); }
.txt { overflow-wrap: anywhere; font-size: 14px; }
.txt .tm { font-size: 11px; letter-spacing: .06em; color: var(--accent); margin-right: 8px; }
.task.done .txt { color: var(--mute); text-decoration: line-through; text-decoration-thickness: 1px; }
.task.done .txt .tm { color: var(--mute); }
.act { width: 30px; height: 30px; color: var(--mute); font-size: 16px; border-radius: 8px; }
.act:hover { color: var(--fg); background: var(--bg); }

.ghosts { display: flex; flex-direction: column; gap: 8px; }
.ghost { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 1px dashed var(--dot-off); border-radius: 12px; }
.ghost i { width: 20px; height: 20px; border: 1.5px solid var(--dot-off); border-radius: 4px; flex: none; }
.ghost b { height: 8px; border-radius: 4px; background: var(--dot-off); max-width: 100%; }
.note { text-align: center; font-size: 11px; letter-spacing: .14em; color: var(--mute); padding: 14px 0 4px; }
.sugg { margin-top: 12px; }
.sl { display: block; font-size: 10px; letter-spacing: .14em; color: var(--mute); margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 14px; border: 1px solid var(--line); border-radius: 17px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.chip:hover { border-color: var(--fg); }
.chip.sel { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.allclear { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 0 2px; }
.ac-n { font-family: var(--f-dot); font-weight: 800; font-size: 150px; line-height: .86; letter-spacing: .02em; }
.ac-t { display: flex; flex-direction: column; align-items: flex-end; padding-bottom: 6px; }
.ac-t b { font-family: var(--f-display); font-weight: 800; font-size: 50px; line-height: .95; letter-spacing: .005em; }
.ac-t b.a { color: var(--accent); }
.ac-cap { font-size: 10px; letter-spacing: .14em; color: var(--mute); margin: 8px 0 12px; }
.nextbtn { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 12px; padding: 16px 18px 16px 20px; border: 1px solid var(--line); border-radius: 28px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-align: left; }
.nextbtn:hover { border-color: var(--fg); }

.add { display: flex; align-items: center; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 2px; }
.add input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--fg); font: inherit; font-size: 13px; padding: 8px 0; }
.add input::placeholder { color: var(--mute); }
.add .go { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 20px; line-height: 1; display: grid; place-items: center; flex: none; }
.clear { margin-top: 6px; font-size: 11px; letter-spacing: .1em; color: var(--mute); text-decoration: underline; text-underline-offset: 3px; }
.clear:hover { color: var(--fg); }

.fabwrap { position: sticky; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); height: 0; z-index: 20; }
.fab { position: absolute; right: 0; bottom: 0; width: 64px; height: 64px; border-radius: 32px; background: var(--accent); color: var(--on-accent); font-size: 34px; line-height: 1; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.22); }
.fab:hover { filter: brightness(1.06); }
.fabhint { position: absolute; right: 76px; bottom: 16px; background: var(--fg); color: var(--bg); padding: 11px 14px; border-radius: 18px; font-size: 10px; letter-spacing: .12em; white-space: nowrap; pointer-events: none; }

.add .opt { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); color: var(--mute); display: grid; place-items: center; flex: none; }
.add .opt:hover { color: var(--fg); border-color: var(--fg); }
.add.first { border: 1.5px solid var(--accent); border-radius: 22px; padding: 5px 7px 5px 14px; margin-top: 14px; }
.addhint { font-size: 10px; letter-spacing: .14em; color: var(--accent); margin: 10px 2px 2px; }
.tm svg { margin-left: 5px; vertical-align: -1px; }
.add .opt.on { border-color: var(--accent); color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 4px; }
.opts[hidden] { display: none; }
.optrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tinp { background: transparent; border: 1px solid var(--line); border-radius: 17px; color: var(--fg); font: inherit; font-size: 11px; letter-spacing: .08em; padding: 8px 12px; color-scheme: light dark; }
.chip.dis { opacity: .45; }
/* overlays: calendar, sheets, toast */
.cal { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.calin { max-width: 460px; margin: 0 auto; padding-block: 16px 48px; }
.calyear { font-family: var(--f-dot); font-weight: 800; font-size: 84px; line-height: .9; letter-spacing: .02em; margin-top: 26px; }
.calmonthrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
.calmonth { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: .005em; min-width: 0; }
.calhead, .crow { display: grid; grid-template-columns: 38px repeat(7, 1fr); align-items: center; }
.calhead { margin-top: 22px; padding-bottom: 8px; font-size: 10px; letter-spacing: .1em; color: var(--mute); text-align: center; }
.calhead span:first-child { text-align: left; padding-left: 8px; }
.crow { width: 100%; padding: 5px 0; border-radius: 16px; text-align: center; }
.crow:hover:not(.cur) { background: var(--surface); }
.crow.cur { background: var(--surface); }
.cw { font-size: 11px; color: var(--mute); text-align: left; padding-left: 8px; letter-spacing: .06em; }
.crow.cur .cw { color: var(--accent); }
.cd { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.cd b { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.cd.out b { color: var(--mute); opacity: .55; }
.cd.today b { background: var(--accent); color: var(--on-accent); opacity: 1; }
.cd i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.cd.has i { background: var(--fg); }
.cd.has.alldone i { background: var(--dot-off); }
.calfoot { margin-top: 18px; font-size: 11px; letter-spacing: .1em; color: var(--mute); }

.ov { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; justify-content: center; overflow-y: auto; }
.panel { width: 100%; max-width: 460px; margin-top: auto; background: var(--surface); border-radius: 28px 28px 0 0; padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.ptitle { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; }
.dp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dp button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10px; letter-spacing: .1em; color: var(--mute); }
.dp b { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--fg); }
.dp button.sel b { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dp button.tdy { color: var(--accent); }
.acct { display: flex; align-items: center; gap: 14px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 28px; flex: none; }
.acct .nm { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; }
.toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 22px; font-size: 11px; letter-spacing: .1em; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 380px) { .wk .num { font-size: 88px; } .name { font-size: 34px; } .calmonth { font-size: 36px; } .calyear { font-size: 72px; } .wel .big { font-size: 180px; } .ac-n { font-size: 120px; } .ac-t b { font-size: 40px; } .ttl { font-size: 48px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<!-- Välkommen -->
<main class="app col wel screen" id="s-welcome" hidden>
  <div class="bar"><span class="sp"></span><button class="pill themebtn" aria-label="Byt tema">AUTO</button></div>
  <div class="lblv">VECKA</div>
  <div class="big" id="wl-num" style="margin-top:6px">00</div>
  <div class="dots" id="wl-dots" aria-hidden="true"></div>
  <h1>Veckolista</h1>
  <p>Planera varje vecka. En dag i taget.</p>
  <div class="acts">
    <button class="btn pri" id="wl-login">Logga in <span aria-hidden="true">→</span></button>
    <button class="btn out" id="wl-signup">Skapa konto</button>
  </div>
</main>

<!-- Logga in -->
<main class="app col screen" id="s-login" hidden>
  <div class="bar"><button class="pill" data-go="welcome" aria-label="Tillbaka">←</button><span class="sp"></span><span class="pill static">VECKOLISTA</span></div>
  <div class="ttl">Logga in</div>
  <div class="sub">VÄLKOMMEN TILLBAKA</div>
  <form class="form" id="f-login" novalidate>
    <label class="fld" id="li-f1"><span class="fl">E-POST</span><input id="li-email" type="email" autocomplete="email" placeholder="namn@epost.se"></label>
    <label class="fld" id="li-f2"><span class="fl">LÖSENORD</span><span class="row"><input id="li-pw" type="password" autocomplete="current-password" placeholder="••••••••"><button type="button" class="show" data-show="li-pw">VISA</button></span></label>
  </form>
  <div class="err" id="li-err" role="alert"></div>
  <div class="rowend" style="margin-top:0"><button class="link" id="li-demo" type="button">ANVÄND DEMOKONTO</button><button class="link" id="li-forgot" type="button">GLÖMT LÖSENORD?</button></div>
  <div style="margin-top:16px"><button class="btn pri" type="submit" form="f-login">Logga in <span aria-hidden="true">→</span></button></div>
  <div class="or">ELLER</div>
  <div class="soc"><button class="btn out" data-social="Apple">Apple</button><button class="btn out" data-social="Google">Google</button></div>
  <div class="foot">SAKNAR DU KONTO? <button data-go="signup">SKAPA KONTO</button></div>
</main>

<!-- Skapa konto -->
<main class="app col screen" id="s-signup" hidden>
  <div class="bar"><button class="pill" data-go="welcome" aria-label="Tillbaka">←</button><span class="sp"></span><span class="pill static">VECKOLISTA</span></div>
  <div class="ttl">Skapa konto</div>
  <div class="sub">DET TAR EN MINUT</div>
  <form class="form" id="f-signup" novalidate>
    <label class="fld" id="su-f1"><span class="fl">NAMN</span><input id="su-name" type="text" autocomplete="name" placeholder="För- och efternamn" maxlength="60"></label>
    <label class="fld" id="su-f2"><span class="fl">E-POST</span><input id="su-email" type="email" autocomplete="email" placeholder="namn@epost.se"></label>
    <label class="fld" id="su-f3"><span class="fl">LÖSENORD</span><span class="row"><input id="su-pw" type="password" autocomplete="new-password" placeholder="Minst 8 tecken"><button type="button" class="show" data-show="su-pw">VISA</button></span></label>
    <div class="strength" id="su-str" aria-live="polite"><i></i><i></i><i></i><i></i><span id="su-strl">MIN. 8 TECKEN</span></div>
  </form>
  <div class="err" id="su-err" role="alert"></div>
  <div><button class="btn pri" type="submit" form="f-signup">Skapa konto <span aria-hidden="true">→</span></button></div>
  <div class="foot">HAR DU REDAN KONTO? <button data-go="login">LOGGA IN</button></div>
</main>

<!-- Huvudsida -->
<main class="app screen" id="s-home" hidden>
  <div class="bar">
    <button class="pill" id="prev" aria-label="Förra veckan">←</button>
    <button class="pill" id="today">IDAG</button>
    <button class="pill" id="next" aria-label="Nästa vecka">→</button>
    <span class="sp"></span>
    <button class="pill themebtn" aria-label="Byt tema">AUTO</button>
    <button class="pill" id="prof" aria-label="Konto">A</button>
  </div>
  <div class="hello" id="hello" hidden><b id="hello-n">HEJ</b><div>DIN FÖRSTA VECKA BÖRJAR HÄR</div></div>
  <button class="wk" id="wkbtn" aria-label="Öppna kalender"><span class="lbl">VECKA</span><span class="num" id="wknum">00</span><span class="grid3" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
  <div class="range" id="range"></div>
  <div class="matrix" id="matrix"></div>
  <div class="sum" id="sum"></div>
  <section id="days"></section>
</main>

<!-- Kalender -->
<div id="cal" class="cal" hidden role="dialog" aria-label="Kalender">
  <div class="calin">
    <div class="bar">
      <button class="pill" id="calclose" aria-label="Stäng kalendern">×</button>
      <span class="sp"></span>
      <button class="pill" id="caltoday">IDAG</button>
    </div>
    <div class="calyear" id="calyear">2026</div>
    <div class="calmonthrow">
      <button class="pill" id="calprev" aria-label="Förra månaden">←</button>
      <div class="calmonth" id="calmonth">OKTOBER</div>
      <button class="pill" id="calnext" aria-label="Nästa månad">→</button>
    </div>
    <div class="calhead"><span>V</span><span>M</span><span>T</span><span>O</span><span>T</span><span>F</span><span>L</span><span>S</span></div>
    <div id="calgrid"></div>
    <div class="calfoot" id="calfoot"></div>
  </div>
</div>

<!-- Konto -->
<div id="settings" class="ov" hidden>
  <div class="panel" role="dialog" aria-label="Konto">
    <div class="bar"><div class="ptitle">Konto</div><span class="sp"></span><button class="pill" id="st-close" aria-label="Stäng">×</button></div>
    <div class="acct"><div class="avatar" id="st-av">A</div><div><div class="nm" id="st-name"></div><div class="sub" id="st-mail"></div></div></div>
    <button class="btn out" id="st-clear">Rensa alla uppgifter</button>
    <button class="btn pri" id="st-out">Logga ut</button>
  </div>
</div>

<div id="toast" class="toast" hidden role="status"></div>

<script>
(function () {
  var KEY = "veckolista-v2";
  var DAYS = ["MÅNDAG","TISDAG","ONSDAG","TORSDAG","FREDAG","LÖRDAG","SÖNDAG"];
  var LET = ["M","T","O","T","F","L","S"];
  var MON = ["JAN","FEB","MAR","APR","MAJ","JUN","JUL","AUG","SEP","OKT","NOV","DEC"];
  var MONTHS = ["JANUARI","FEBRUARI","MARS","APRIL","MAJ","JUNI","JULI","AUGUSTI","SEPTEMBER","OKTOBER","NOVEMBER","DECEMBER"];
  var MAXDOTS = 6;
  var CLOCK = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/></svg>';
  var BELL = '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Påminnelse"><path d="M3 12h10l-1.2-2V7a3.8 3.8 0 0 0-7.6 0v3z"/><path d="M6.5 14h3"/></svg>';
  var SUGG = ["Handla mat", "Träning", "Läs 10 sidor"];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function fromKey(k) { return new Date(k + "T12:00:00"); }
  function isoWeek(date) {
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    var w1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var today = new Date(), todayKey = key(today);
  var state = { users: {}, session: null, theme: "system" };
  var weekStart = mondayOf(today), openKey = todayKey, focusKey = null;

  /* ---------- storage ---------- */
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); if (s && s.users) state = s; } } catch (e) {}
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function cur() { return (state.session && state.users[state.session]) || null; }
  function allTasks() { var u = cur(); return u ? u.tasks : {}; }
  function list(k) { return allTasks()[k] || []; }
  function totalTasks() { var n = 0, t = allTasks(); for (var k in t) n += t[k].length; return n; }
  function push(k, t) { var all = allTasks(); (all[k] = all[k] || []).push(t); }

  async function hash(pw, email) {
    try {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vl:" + email + ":" + pw));
      return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    } catch (e) { return "x" + btoa(unescape(encodeURIComponent(email + pw))); }
  }
  function seedTasks(t) {
    var m = mondayOf(new Date());
    function put(off, text, done) { var k = key(addDays(m, off)); (t[k] = t[k] || []).push({ id: uid(), t: text, d: !!done }); }
    put(0, "Skicka offert till kund", true); put(0, "Läs 10 sidor", false); put(0, "Handla mat", false); put(0, "Skissa onboarding-flödet", false);
    put(1, "Designa startskärmen", false); put(1, "Ring bankärendet", false); put(2, "Träning", false); put(4, "Planera nästa vecka", false);
  }
  async function ensureDemo() {
    var em = "anna@epost.se";
    if (state.users[em]) return;
    var h = await hash("veckolista1", em), t = {};
    seedTasks(t);
    state.users[em] = { name: "Anna Svensson", hash: h, tasks: t };
    save();
  }

  /* ---------- theme, toast, screens ---------- */
  function applyTheme() {
    var r = document.documentElement;
    if (state.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
    var label = state.theme === "system" ? "AUTO" : state.theme === "light" ? "LJUS" : "MÖRK";
    Array.prototype.forEach.call(document.querySelectorAll(".themebtn"), function (b) { b.textContent = label; });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".themebtn"), function (b) {
    b.onclick = function () { state.theme = state.theme === "system" ? "light" : state.theme === "light" ? "dark" : "system"; applyTheme(); save(); };
  });
  var toastT = null;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2400);
  }
  function show(name) {
    ["welcome", "login", "signup", "home"].forEach(function (s) { $("s-" + s).hidden = s !== name; });
    window.scrollTo(0, 0);
    if (name === "welcome") renderWelcome();
    if (name === "home") enterHome();
    if (name === "login") { $("li-err").textContent = ""; $("li-f1").classList.remove("bad"); $("li-f2").classList.remove("bad"); }
    if (name === "signup") { $("su-err").textContent = ""; ["su-f1", "su-f2", "su-f3"].forEach(function (i) { $(i).classList.remove("bad"); }); }
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) { b.onclick = function () { show(b.getAttribute("data-go")); }; });
  $("wl-login").onclick = function () { show("login"); };
  $("wl-signup").onclick = function () { show("signup"); };

  function renderWelcome() {
    var t = new Date(), idx = (t.getDay() + 6) % 7, h = "";
    $("wl-num").textContent = pad(isoWeek(t));
    for (var i = 0; i < 7; i++) h += '<i class="' + (i < idx ? "on" : i === idx ? "now" : "") + '"></i>';
    $("wl-dots").innerHTML = h;
  }

  /* ---------- auth ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("[data-show]"), function (b) {
    b.onclick = function () {
      var inp = $(b.getAttribute("data-show")), vis = inp.type === "password";
      inp.type = vis ? "text" : "password"; b.textContent = vis ? "DÖLJ" : "VISA";
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-social]"), function (b) {
    b.onclick = function () { toast(b.getAttribute("data-social").toUpperCase() + " ÄR INTE KOPPLAT I DEMON ÄN"); };
  });
  $("li-forgot").onclick = function () { toast("ÅTERSTÄLLNING ÄR INTE KOPPLAD I DEMON ÄN"); };
  $("li-demo").onclick = function () { $("li-email").value = "anna@epost.se"; $("li-pw").value = "veckolista1"; $("li-err").textContent = ""; toast("DEMOKONTO IFYLLT. TRYCK LOGGA IN"); };
  var EMAIL_RE = /^\S+@\S+\.\S+$/;

  $("f-login").addEventListener("submit", async function (e) {
    e.preventDefault();
    var em = $("li-email").value.trim().toLowerCase(), pw = $("li-pw").value, err = $("li-err");
    $("li-f1").classList.remove("bad"); $("li-f2").classList.remove("bad"); err.textContent = "";
    if (!em || !pw) { err.textContent = "FYLL I E-POST OCH LÖSENORD"; (em ? $("li-f2") : $("li-f1")).classList.add("bad"); return; }
    if (!EMAIL_RE.test(em)) { err.textContent = "E-POSTEN VERKAR INTE RÄTT"; $("li-f1").classList.add("bad"); return; }
    await ensureDemo();
    var u = state.users[em];
    if (!u) { err.textContent = "INGEN ANVÄNDARE MED DEN E-POSTEN. SKAPA KONTO?"; $("li-f1").classList.add("bad"); return; }
    if ((await hash(pw, em)) !== u.hash) { err.textContent = "FEL LÖSENORD. FÖRSÖK IGEN"; $("li-f2").classList.add("bad"); return; }
    state.session = em; save(); $("li-pw").value = ""; show("home");
  });

  function strength(pw) {
    var s = 0;
    if (pw.length >= 8) s++;
    if (pw.length >= 12) s++;
    if (/[a-zåäö]/.test(pw) && /[A-ZÅÄÖ]/.test(pw)) s++;
    if (/\d/.test(pw) && /[^A-Za-z0-9åäöÅÄÖ]/.test(pw)) s++;
    return pw.length < 8 ? Math.min(s, 0) : Math.max(s, 1);
  }
  $("su-pw").addEventListener("input", function () {
    var pw = $("su-pw").value, s = strength(pw), dots = $("su-str").querySelectorAll("i");
    for (var i = 0; i < 4; i++) dots[i].className = i < s ? "on" : "";
    $("su-strl").textContent = pw.length < 8 ? "MIN. 8 TECKEN" : ["", "SVAGT", "OK", "BRA", "STARKT"][s];
  });
  $("f-signup").addEventListener("submit", async function (e) {
    e.preventDefault();
    var nm = $("su-name").value.trim(), em = $("su-email").value.trim().toLowerCase(), pw = $("su-pw").value, err = $("su-err");
    ["su-f1", "su-f2", "su-f3"].forEach(function (i) { $(i).classList.remove("bad"); }); err.textContent = "";
    if (!nm) { err.textContent = "SKRIV ETT NAMN"; $("su-f1").classList.add("bad"); return; }
    if (!EMAIL_RE.test(em)) { err.textContent = "E-POSTEN VERKAR INTE RÄTT"; $("su-f2").classList.add("bad"); return; }
    await ensureDemo();
    if (state.users[em]) { err.textContent = "DEN E-POSTEN HAR REDAN ETT KONTO. LOGGA IN?"; $("su-f2").classList.add("bad"); return; }
    if (pw.length < 8) { err.textContent = "LÖSENORDET MÅSTE VARA MINST 8 TECKEN"; $("su-f3").classList.add("bad"); return; }
    state.users[em] = { name: nm, hash: await hash(pw, em), tasks: {} };
    state.session = em; save();
    $("su-name").value = ""; $("su-email").value = ""; $("su-pw").value = "";
    $("su-str").querySelectorAll("i").forEach(function (i) { i.className = ""; });
    show("home");
    toast("KONTO SKAPAT. VÄLKOMMEN, " + nm.split(" ")[0].toUpperCase());
  });

  /* ---------- home ---------- */
  function enterHome() {
    today = new Date(); todayKey = key(today);
    weekStart = mondayOf(today); openKey = todayKey;
    var u = cur();
    $("prof").textContent = u ? u.name.charAt(0).toUpperCase() : "?";
    render();
  }
  function sorted(ts) {
    return ts.slice().sort(function (a, b) {
      if (a.time && b.time) return a.time < b.time ? -1 : a.time > b.time ? 1 : 0;
      return a.time ? -1 : b.time ? 1 : 0;
    });
  }
  function render() {
    var u = cur(); if (!u) return;
    var dates = [], i;
    for (i = 0; i < 7; i++) dates.push(addDays(weekStart, i));
    $("wknum").textContent = pad(isoWeek(weekStart));
    var a = dates[0], b = dates[6];
    $("range").textContent = a.getDate() + " " + MON[a.getMonth()] + " – " + b.getDate() + " " + MON[b.getMonth()] + " " + addDays(weekStart, 3).getFullYear();
    var none = totalTasks() === 0;
    $("hello").hidden = !none;
    if (none) $("hello-n").innerHTML = "HEJ " + esc(u.name.split(" ")[0].toUpperCase()) + "<em>!</em>";

    var total = 0, done = 0, mh = "", dh = "";
    dates.forEach(function (d, idx) {
      var k = key(d), ts = list(k), isToday = k === todayKey;
      total += ts.length;
      ts.forEach(function (t) { if (t.d) done++; });
      var dots = "";
      if (!ts.length) dots = '<span class="dot ring"></span>';
      else {
        ts.slice(0, MAXDOTS).forEach(function (t) { dots += '<span class="dot' + (t.d ? " done" : "") + '"></span>'; });
        if (ts.length > MAXDOTS) dots += '<span class="more">+' + (ts.length - MAXDOTS) + "</span>";
      }
      mh += '<button class="mcol' + (isToday ? " today" : "") + (k === openKey ? " sel" : "") + '" data-pick="' + k + '" aria-label="' + DAYS[idx] + '"><span class="l">' + LET[idx] + "</span>" + dots + "</button>";

      var open = k === openKey, dn = ts.filter(function (t) { return t.d; }).length;
      var meta = (isToday ? '<span class="now">IDAG</span> · ' : "") + d.getDate() + " " + MON[d.getMonth()] + (ts.length ? " · " + dn + "/" + ts.length : "");
      dh += '<div class="day' + (open ? " open" : "") + '"><button class="dayhead" data-head="' + k + '" aria-expanded="' + open + '"><span class="name">' + DAYS[idx] + '</span><span class="meta">' + meta + "</span></button>";
      if (open) {
        var allDone = ts.length > 0 && dn === ts.length;
        if (allDone) dh += '<div class="allclear"><div class="ac-n">0</div><div class="ac-t"><b>ALLT</b><b class="a">KLART</b></div></div><div class="ac-cap">0 KVAR · ' + dn + " / " + ts.length + " KLARA</div>";
        dh += '<ul class="tasks">';
        sorted(ts).forEach(function (t) {
          dh += '<li class="task' + (t.d ? " done" : "") + '" data-id="' + t.id + '" data-k="' + k + '">' +
            '<button class="chk" data-act="tog" aria-label="Bocka av" aria-pressed="' + t.d + '"></button>' +
            '<span class="txt">' + (t.time ? '<span class="tm">' + esc(t.time) + BELL + "</span>" : "") + esc(t.t) + "</span>" +
            '<button class="act" data-act="mv" aria-label="Flytta till nästa dag" title="Flytta till nästa dag">→</button>' +
            '<button class="act" data-act="del" aria-label="Ta bort" title="Ta bort">×</button></li>';
        });
        dh += "</ul>";
        if (!ts.length) {
          dh += '<div class="ghosts"><div class="ghost" style="opacity:.75"><i></i><b style="width:130px"></b></div><div class="ghost" style="opacity:.45"><i></i><b style="width:90px"></b></div><div class="ghost" style="opacity:.25"><i></i><b style="width:150px"></b></div></div>';
          dh += '<div class="note">INGET PLANERAT ÄNNU</div><div class="sugg"><span class="sl">KOM IGÅNG MED ETT FÖRSLAG</span><div class="chips">';
          SUGG.forEach(function (s) { dh += '<button class="chip" data-sug="' + esc(s) + '" data-k="' + k + '">+ ' + esc(s) + "</button>"; });
          dh += "</div></div>";
        }
        dh += '<form class="add' + (none ? " first" : "") + '" data-k="' + k + '"' + (none ? "" : ' style="margin-top:' + (ts.length ? "2px" : "14px") + '"') + '><input id="add-' + k + '" type="text" autocomplete="off" placeholder="' + (none ? "Första uppgiften..." : "Lägg till en uppgift...") + '" maxlength="140"><button class="opt" type="button" data-opt="' + k + '" aria-label="Tid, påminnelse och upprepning" title="Tid, påminnelse och upprepning">' + CLOCK + '</button><button class="go" type="submit" aria-label="Lägg till">+</button></form>';
        if (none) dh += '<div class="addhint">↑ BÖRJA HÄR. KLOCKAN = PÅMINNELSE</div>';
        dh += '<div class="opts" id="opts-' + k + '" hidden><span class="sl" style="margin:0">TID = PÅMINNELSE</span><div class="chips">' + ["INGEN", "09:00", "12:00", "17:00"].map(function (x) { return '<button type="button" class="chip" data-pt="' + x + '" data-k="' + k + '">' + x + '</button>'; }).join("") + '</div><div class="optrow"><input class="tinp" type="time" id="tm-' + k + '" data-k="' + k + '" aria-label="Egen tid"></div></div>';
        if (dn) dh += '<button class="clear" data-clear="' + k + '">RENSA KLARA</button>';
        if (allDone) {
          if (idx < 6) {
            var nk = key(dates[idx + 1]), left = list(nk).filter(function (t) { return !t.d; }).length;
            dh += '<button class="nextbtn" data-goto="' + nk + '"><span>NÄSTA: ' + DAYS[idx + 1] + " · " + (left ? left + (left === 1 ? " UPPGIFT" : " UPPGIFTER") : "INGET PLANERAT") + '</span><span aria-hidden="true">→</span></button>';
          } else dh += '<button class="nextbtn" data-nextweek="1"><span>NÄSTA VECKA · V' + pad(isoWeek(addDays(weekStart, 7))) + '</span><span aria-hidden="true">→</span></button>';
        }
      }
      dh += "</div>";
    });
    $("matrix").innerHTML = mh;
    $("days").innerHTML = dh;
    $("sum").innerHTML = "<span><b>" + done + " / " + total + "</b> KLARA</span><span>" + (total - done) + " KVAR</span>";
    if (focusKey) { var inp = $("add-" + focusKey); if (inp) inp.focus(); focusKey = null; }
  }

  function setWeek(ws) {
    weekStart = ws;
    var mk = key(ws), end = key(addDays(ws, 6));
    openKey = (todayKey >= mk && todayKey <= end) ? todayKey : mk;
    render();
  }
  $("prev").onclick = function () { setWeek(addDays(weekStart, -7)); };
  $("next").onclick = function () { setWeek(addDays(weekStart, 7)); };
  $("today").onclick = function () { todayKey = key(new Date()); setWeek(mondayOf(new Date())); openKey = todayKey; render(); };

  $("matrix").addEventListener("click", function (e) {
    var b = e.target.closest("[data-pick]"); if (!b) return;
    openKey = b.getAttribute("data-pick"); render();
    try { var o = document.querySelector(".day.open"); if (o) o.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (x) {}
  });

  var pend = { k: null, time: "", rem: false };
  function pendFor(k) { if (pend.k !== k) pend = { k: k, time: "", rem: false }; }
  function updatePend(k) {
    var box = $("opts-" + k); if (!box) return;
    Array.prototype.forEach.call(box.querySelectorAll("[data-pt]"), function (c) {
      var v = c.getAttribute("data-pt");
      c.classList.toggle("sel", v === (pend.time || "INGEN"));
    });
    var ti = $("tm-" + k); if (ti && ti.value !== pend.time) ti.value = pend.time;
    var ob = document.querySelector('[data-opt="' + k + '"]'); if (ob) ob.classList.toggle("on", !!pend.time);
  }
  var daysEl = $("days");
  daysEl.addEventListener("click", function (e) {
    var h = e.target.closest("[data-head]");
    if (h) { var k = h.getAttribute("data-head"); openKey = openKey === k ? null : k; render(); return; }
    var op = e.target.closest("[data-opt]");
    if (op) { var ok = op.getAttribute("data-opt"), bx = $("opts-" + ok); pendFor(ok); bx.hidden = !bx.hidden; updatePend(ok); return; }
    var pt = e.target.closest("[data-pt]");
    if (pt) { var pk = pt.getAttribute("data-k"), pv = pt.getAttribute("data-pt"); pendFor(pk); pend.time = pv === "INGEN" ? "" : pv; if (!pend.time) pend.rem = false; updatePend(pk); return; }
    var c = e.target.closest("[data-clear]");
    if (c) { var ck = c.getAttribute("data-clear"); allTasks()[ck] = list(ck).filter(function (t) { return !t.d; }); save(); render(); return; }
    var sg = e.target.closest("[data-sug]");
    if (sg) { push(sg.getAttribute("data-k"), { id: uid(), t: sg.getAttribute("data-sug"), d: false }); save(); render(); return; }
    var gt = e.target.closest("[data-goto]");
    if (gt) { openKey = gt.getAttribute("data-goto"); render(); try { var o2 = document.querySelector(".day.open"); if (o2) o2.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (x2) {} return; }
    if (e.target.closest("[data-nextweek]")) { setWeek(addDays(weekStart, 7)); return; }
    var btn = e.target.closest("[data-act]"); if (!btn) return;
    var li = btn.closest(".task"), k2 = li.getAttribute("data-k"), id = li.getAttribute("data-id");
    var arr = list(k2), idx = arr.findIndex(function (t) { return t.id === id; });
    if (idx < 0) return;
    var act = btn.getAttribute("data-act");
    if (act === "tog") arr[idx].d = !arr[idx].d;
    else if (act === "del") arr.splice(idx, 1);
    else if (act === "mv") { var t = arr.splice(idx, 1)[0], nk2 = key(addDays(fromKey(k2), 1)); push(nk2, t); }
    allTasks()[k2] = arr; save(); render();
  });
  daysEl.addEventListener("change", function (e) {
    var ti = e.target.closest(".tinp"); if (!ti) return;
    var k = ti.getAttribute("data-k"); pendFor(k); pend.time = ti.value; if (!pend.time) pend.rem = false; updatePend(k);
  });
  daysEl.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, k = f.getAttribute("data-k"), inp = f.querySelector("input");
    var v = inp.value.trim(); if (!v) { inp.focus(); return; }
    var nt = { id: uid(), t: v, d: false };
    if (pend.k === k && pend.time) nt.time = pend.time;
    pend = { k: null, time: "", rem: false };
    push(k, nt); save(); focusKey = k; render();
    if (nt.time) toast("TILLAGD · PÅMINNELSE " + nt.time);
  });

  /* ---------- account ---------- */
  var clearArmed = false;
  function openSettings() {
    var u = cur(); if (!u) return;
    $("st-av").textContent = u.name.charAt(0).toUpperCase(); $("st-name").textContent = u.name; $("st-mail").textContent = state.session.toUpperCase();
    clearArmed = false; $("st-clear").textContent = "Rensa alla uppgifter"; $("settings").hidden = false;
  }
  $("prof").onclick = openSettings;
  $("st-close").onclick = function () { $("settings").hidden = true; };
  $("settings").addEventListener("click", function (e) { if (e.target === $("settings")) $("settings").hidden = true; });
  $("st-clear").onclick = function () {
    if (!clearArmed) { clearArmed = true; $("st-clear").textContent = "Tryck igen för att bekräfta"; return; }
    cur().tasks = {}; save(); clearArmed = false; $("settings").hidden = true; render(); toast("ALLA UPPGIFTER RENSADE");
  };
  $("st-out").onclick = function () { state.session = null; save(); $("settings").hidden = true; show("welcome"); toast("DU ÄR UTLOGGAD"); };

  /* ---------- calendar ---------- */
  var cal = $("cal"), calMonth = null;
  function monthOfWeek() { var th = addDays(weekStart, 3); return new Date(th.getFullYear(), th.getMonth(), 1); }
  function renderCal() {
    var y = calMonth.getFullYear(), m = calMonth.getMonth();
    $("calyear").textContent = y; $("calmonth").textContent = MONTHS[m];
    var start = mondayOf(new Date(y, m, 1)), last = new Date(y, m + 1, 0), curKey = key(weekStart), h = "", r, c;
    for (r = 0; addDays(start, r * 7) <= last; r++) {
      var mon = addDays(start, r * 7), mk = key(mon);
      h += '<button class="crow' + (mk === curKey ? " cur" : "") + '" data-w="' + mk + '" aria-label="Vecka ' + isoWeek(mon) + '"><span class="cw">' + pad(isoWeek(mon)) + "</span>";
      for (c = 0; c < 7; c++) {
        var d = addDays(mon, c), k = key(d), ts = list(k), all = ts.length && ts.every(function (t) { return t.d; });
        h += '<span class="cd' + (d.getMonth() !== m ? " out" : "") + (k === todayKey ? " today" : "") + (ts.length ? " has" : "") + (all ? " alldone" : "") + '"><b>' + d.getDate() + "</b><i></i></span>";
      }
      h += "</button>";
    }
    $("calgrid").innerHTML = h;
    var a = weekStart, b = addDays(weekStart, 6);
    $("calfoot").textContent = "VALD: VECKA " + pad(isoWeek(weekStart)) + " · " + addDays(weekStart, 3).getFullYear() + " · " + a.getDate() + " " + MON[a.getMonth()] + " – " + b.getDate() + " " + MON[b.getMonth()];
  }
  function openCal() { calMonth = monthOfWeek(); renderCal(); cal.hidden = false; $("calclose").focus(); }
  function closeCal() { cal.hidden = true; $("wkbtn").focus(); }
  $("wkbtn").onclick = openCal;
  $("calclose").onclick = closeCal;
  $("caltoday").onclick = function () { todayKey = key(new Date()); setWeek(mondayOf(new Date())); closeCal(); };
  $("calprev").onclick = function () { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
  $("calnext").onclick = function () { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };
  $("calgrid").addEventListener("click", function (e) {
    var row = e.target.closest("[data-w]"); if (!row) return;
    setWeek(fromKey(row.getAttribute("data-w"))); closeCal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("settings").hidden) $("settings").hidden = true; else if (!cal.hidden) closeCal();
  });

  /* ---------- start ---------- */
  load(); applyTheme();
  show(cur() ? "home" : "welcome");
  ensureDemo();
})();
</script>

</body>
